<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>PocketDo</title>
  <meta name="description" content="A minimalist to-do list and daily habit tracker that syncs between your phone and your computer.">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light dark">

  <!-- Home-screen app (iOS and Android) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PocketDo">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
  <link rel="stylesheet" href="style.css?v=1.2.0">

  <script src="themes.js?v=1.2.0"></script>
  <script>
    (function () {
      var ui = {};
      try { ui = JSON.parse(localStorage.getItem('pt-ui') || '{}') || {}; } catch (e) { ui = {}; }
      window.PT_applyTheme(ui.theme || 'auto', ui.accent || null);

      // Behave like a native app: no pinch zoom, no double-tap zoom, no ctrl/trackpad zoom.
      // (iOS ignores user-scalable=no in some cases, so the gestures are blocked here too.)
      var stop = function (e) { e.preventDefault(); };
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
        document.addEventListener(t, stop, { passive: false });
      });
      document.addEventListener('touchmove', function (e) {
        if ((e.touches && e.touches.length > 1) || (e.scale !== undefined && e.scale !== 1)) e.preventDefault();
      }, { passive: false });
      document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    })();
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg class="mark" viewBox="0 0 100 100">
      <circle class="mark-ring" cx="50" cy="50" r="30" transform="rotate(-10.5 50 50)"/>
      <polyline class="mark-check" points="35,51 46,62 80,24"/>
    </svg>
    <div class="splash-name">PocketDo</div>
  </div>

  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.78.0"></script>
  <script src="config.js?v=1.2.0"></script>
  <script src="i18n.js?v=1.2.0"></script>
  <script src="store.js?v=1.2.0"></script>
  <script src="app.js?v=1.2.0"></script>
</body>
</html>
