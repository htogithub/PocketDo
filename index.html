<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PocketDo</title>
  <meta name="description" content="A minimalist to-do list and daily habit tracker that syncs between your phone and your computer.">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light dark">

  <!-- Home-screen app (iOS and Android) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PocketDo">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
  <link rel="stylesheet" href="style.css">

  <script src="themes.js"></script>
  <script>
    (function () {
      var ui = {};
      try { ui = JSON.parse(localStorage.getItem('pt-ui') || '{}') || {}; } catch (e) { ui = {}; }
      window.PT_applyTheme(ui.theme || 'auto', ui.accent || null);
    })();
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg class="mark" viewBox="0 0 100 100">
      <circle class="mark-ring" cx="50" cy="50" r="30" pathLength="100" transform="rotate(-10.5 50 50)"/>
      <polyline class="mark-check" points="35,51 46,62 80,24" pathLength="1"/>
    </svg>
    <div class="splash-name">PocketDo</div>
  </div>

  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.78.0"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
